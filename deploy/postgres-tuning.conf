# PostgreSQL tuning for the 2 CPU / 2 GB RAM VPS (spec v1.1, Bagian 1).
# Apply with ALTER SYSTEM (or drop into postgresql.conf), then restart PostgreSQL.
#   sudo -u postgres psql -c "ALTER SYSTEM SET shared_buffers = '256MB';"
#   sudo -u postgres psql -c "ALTER SYSTEM SET max_connections = 30;"
#   sudo -u postgres psql -c "ALTER SYSTEM SET work_mem = '4MB';"
#   sudo -u postgres psql -c "ALTER SYSTEM SET maintenance_work_mem = '64MB';"
#   sudo -u postgres psql -c "ALTER SYSTEM SET effective_cache_size = '512MB';"
# The backend's Prisma pool is also limited (connection_limit=5 in DATABASE_URL).
shared_buffers = 256MB
max_connections = 30
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 512MB
