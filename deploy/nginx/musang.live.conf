# Muse Management Control — musang.mikasu.lol
# Static frontend + /api and /ws proxied to the Fastify backend (127.0.0.1:3001).
# TLS: Cloudflare Origin CA certificate (or self-signed with zone SSL mode "Full"
# scoped to this hostname via a Cloudflare Configuration Rule — the zone default
# stays "Flexible" for the other hosts on this VPS).
server {
    listen 443 ssl;
    http2 on;
    server_name musang.mikasu.lol;

    ssl_certificate     /etc/nginx/ssl/musang.mikasu.lol.pem;
    ssl_certificate_key /etc/nginx/ssl/musang.mikasu.lol.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/musang;
    index index.html;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket real-time updates
    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }


    # Zero-touch enrollment document (rendered live by the backend so the
    # enrollment key in it is always current)
    location = /agent.md {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bridge downloads for self-enrollment — served from a fixed directory
    # outside the frontend root so a frontend redeploy can never shadow
    # them with the SPA fallback again (incident 2026-11-26: /bridge.cjs
    # returned the 1,584-byte dashboard HTML page).
    location = /bridge.cjs {
        root /opt/muse-control/downloads;
        default_type application/octet-stream;
    }

    location = /install.sh {
        root /opt/muse-control/downloads;
        default_type application/octet-stream;
    }

    # SPA static files (Nuxt generate output, 200.html fallback)
    location / {
        try_files $uri $uri/ /200.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/html application/json;
}
