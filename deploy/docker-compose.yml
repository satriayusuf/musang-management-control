services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: muse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: muse_control
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=30
      - -c
      - work_mem=4MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m

  app:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://muse:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/muse_control?connection_limit=5
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mikasu.lol}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set in .env}
      PORT: "3001"
      HOST: "0.0.0.0"
      POOL_PROVIDER: "none"
    depends_on:
      - postgres
    mem_limit: 384m

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/musang.mikasu.lol.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/.output/public:/var/www/musang:ro
    depends_on:
      - app
    mem_limit: 128m

volumes:
  pgdata:
